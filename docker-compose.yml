services:
  postgres:
    image: postgres:16-alpine
    container_name: synthdetect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: synthdetect
      POSTGRES_USER: synthdetect
      POSTGRES_PASSWORD: synthdetect_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthdetect"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
