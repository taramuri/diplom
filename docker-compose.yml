services:
  postgres:
    image: postgres:16-alpine
    container_name: synthdetect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: synthdetect
      POSTGRES_USER: synthdetect
      POSTGRES_PASSWORD: synthdetect_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthdetect"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: synthdetect-ml
    restart: unless-stopped
    environment:
      MODEL_PATH: /app/models/efficientnet_b0_synthdetect.pth
      MODEL_VERSION: efficientnet_b0_v1.0
      DEVICE: cpu
      HOST: 0.0.0.0
      PORT: 8000
      MAX_FILE_SIZE_MB: 10
    ports:
      - "8000:8000"
    volumes:
      - ./ml-service/models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  postgres_data:
